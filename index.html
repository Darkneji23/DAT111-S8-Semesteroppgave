<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bolig i Bergen</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <section class="hero">
      <h1 class="hero__title">
        <img class="hero__logo" src="images/logo.png" alt="Bolig i Bergen" />
      </h1>
    </section>

    <main class="page-content">
      <section class="page-content__section about-summary">
        <div class="section-heading">
          <h2 class="section-heading__title">Om Oss</h2>
          <p class="section-heading__text">
            BIB er et boligselskap i Bergen.
            <a class="section-heading__link" href="./pages/om-bib.html">Les mer</a>
          </p>
        </div>
      </section>

      <section class="page-content__section reviews-section">
        <div class="section-heading">
          <h2 class="section-heading__title">Hvorfor BIB?</h2>
          <p class="section-heading__text">Ikke hør på oss, hør på fornøyde kunder</p>
        </div>

        <div class="reviews">
          <article class="review">
            <p class="review__text">"Figma Balls"</p>
            <div class="review__author">
              <img class="review__avatar" src="./images/simien.png" alt="Simien" />
              <div class="review__meta">
                <span class="review__name">Simien</span>
                <span class="review__rating">⭐⭐⭐⭐⭐</span>
              </div>
            </div>
          </article>

          <article class="review">
            <p class="review__text">"Figma Balls 2"</p>
            <div class="review__author">
              <img class="review__avatar" src="./images/bjorn.png" alt="Bjørn" />
              <div class="review__meta">
                <span class="review__name">Bjørn</span>
                <span class="review__rating">⭐⭐⭐⭐⭐</span>
              </div>
            </div>
          </article>
        </div>
      </section>
    </main>

    <script src="scripts/test.js"></script>
    <script src="scripts/header.js"></script>
    <script src="scripts/footer.js"></script>
  </body>
</html>
